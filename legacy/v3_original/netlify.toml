# netlify.toml
[build]
  publish = "."

# ── Security headers ──────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com https://codemirror.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://codemirror.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebase.googleapis.com wss://*.firebaseio.com; img-src 'self' data: blob:; worker-src blob:; frame-ancestors 'none';"

# ── Route redirects (HTML pages only — NOT assets) ───────────────
# Netlify serves static files first by default (force=false).
# These redirects only fire when no real file exists at the path.

[[redirects]]
  from   = "/student"
  to     = "/student/index.html"
  status = 200
  force  = false

[[redirects]]
  from   = "/student/"
  to     = "/student/index.html"
  status = 200
  force  = false

[[redirects]]
  from   = "/teacher"
  to     = "/teacher/index.html"
  status = 200
  force  = false

[[redirects]]
  from   = "/teacher/"
  to     = "/teacher/index.html"
  status = 200
  force  = false

[[redirects]]
  from   = "/admin"
  to     = "/admin/index.html"
  status = 200
  force  = false

[[redirects]]
  from   = "/admin/"
  to     = "/admin/index.html"
  status = 200
  force  = false

# NOTE: No /* catch-all redirect.
# Netlify automatically serves index.html for directory roots.
# A /* redirect would intercept /js/, /css/, /data/ file requests
# and serve HTML instead of JS/CSS — breaking all module imports.
