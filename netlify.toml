# CS Lifeline v4 — Netlify deployment (static site; no build step).
# Routes /, /student/, /teacher/, /admin/ are real folders under public/.
[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://*.googleusercontent.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.cloudfunctions.net https://*.firebaseio.com wss://*.firebaseio.com; frame-src https://*.firebaseapp.com https://accounts.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/data/demo/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Old and short routes. Static files are always served first (force = false), so these never
# intercept /js/, /css/ or /data/ requests.
[[redirects]]
  from = "/student"
  to = "/student/"
  status = 301
[[redirects]]
  from = "/teacher"
  to = "/teacher/"
  status = 301
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
[[redirects]]
  from = "/demo"
  to = "/?mode=demo"
  status = 302
